<html>
    <head>
        <title>Trivial Pursuit</title>
        <link rel="stylesheet" href="styles.css">
        <script src="game.js" defer></script>
    </head>
    <body>
        <header class="game-header">
            <h1>Trivial Pursuit</h1>
            <p>Kerää kaikki kategoriat</p>
        </header>

        <section class="status-panel">
            <article class="player-card">
                <h2>Pelaaja</h2>
                <img src="Icon001.png" class="player-image">
                <p>Kerätyt aihealueet: 0/6</p>
            </article>

            <article class="dice-panel">
                <p>Vuorossa:</p>
                <h2>Pelaaja</h2>
                <button>Heitä noppaa</button>

                <div id="board" class="board">Pelilauta placeholder</div>
            </article>

            <article class="player-card">
                <h2>Tietokone</h2>
                <img src="WIREDback.png" class="player-image">
                <p>Kerätyt aihealueet: 0/6</p>
            </article>
        </section>
    </body>
</html>
